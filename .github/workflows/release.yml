name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run assets
      - run: npm run release:check
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: mkdir -p dist && npm pack -w @itismaku/clawdeck --pack-destination dist
      - run: npm run release:verify-artifacts
      - run: npm publish -w @itismaku/clawdeck --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/*.streamDeckPlugin --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
