name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@12.0.2
      - run: npm ci
      - run: npm run assets
      - run: npm run release:check
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: mkdir -p dist && npm pack -w @itismaku/clawdeck --pack-destination dist
      - run: npm run release:verify-artifacts
      - run: npm publish -w @itismaku/clawdeck --access public --provenance
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/*.streamDeckPlugin --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
